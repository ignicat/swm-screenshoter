name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: |
          cargo build --locked --release
          ./target/release/swm-screenshoter --version
          ./target/release/swm-screenshoter --help
      - name: Package release archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          stage="swm-screenshoter-v${version}-linux-x86_64"
          mkdir -p "dist/${stage}/bin"
          install -Dm755 target/release/swm-screenshoter "dist/${stage}/bin/swm-screenshoter"
          cp -r packaging "dist/${stage}/packaging"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && sha256sum "${stage}.tar.gz" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes=$(printf '%s\n' \
            'Initial release of **swm-screenshoter**, the freeze-frame screenshot utility and org.freedesktop.impl.portal.Screenshot backend for **swm** (built on Ubuntu 24.04 x86_64).' \
            '' \
            'Archive contents:' \
            '- bin/swm-screenshoter' \
            '- packaging/ (portal, D-Bus service, and systemd user unit)' \
            '' \
            'Requires Wayland runtime libraries (libwayland-client, libxkbcommon, libfontconfig) and a running swm session.')
          if gh release view "${TAG_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --repo "${REPO}" --clobber
          else
            gh release create "${TAG_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --repo "${REPO}" --title "swm-screenshoter ${TAG_NAME}" --notes "${notes}"
          fi
